name: ${COMPOSE_PROJECT_NAME:-vietnam_weather_prod}

services:
  database:
    image: postgis/postgis@sha256:350d6e4617de2f9bd04e2c4d661c8df2bab8627eefba6119819f43091fb2de47
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      API_DB_USER: ${API_DB_USER:?API_DB_USER is required}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?API_DB_PASSWORD is required}
    volumes:
      - database_data:/var/lib/postgresql/data
      - ./infra/postgres/init/001-enable-postgis.sql:/docker-entrypoint-initdb.d/001-enable-postgis.sql:ro
      - ./infra/postgres/init/002-create-seed-audit.sql:/docker-entrypoint-initdb.d/002-create-seed-audit.sql:ro
      - ./infra/postgres/init/003-create-api-security.sh:/docker-entrypoint-initdb.d/003-create-api-security.sh:ro
      - ./infra/postgres/init/004-create-phase4-data-model.sql:/docker-entrypoint-initdb.d/004-create-phase4-data-model.sql:ro
      - ./infra/postgres/init/005-create-phase5-weather-runtime.sql:/docker-entrypoint-initdb.d/005-create-phase5-weather-runtime.sql:ro
      - ./infra/postgres/init/006-create-weather-worker-security.sh:/docker-entrypoint-initdb.d/006-create-weather-worker-security.sh:ro
      - ./infra/postgres/init/007-create-phase6-risk-engine.sql:/docker-entrypoint-initdb.d/007-create-phase6-risk-engine.sql:ro
      - ./infra/postgres/init/010-vietnam-boundary-data.sql:/docker-entrypoint-initdb.d/010-vietnam-boundary-data.sql:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis@sha256:a7859ed111db3c1f5404a973a4747505d559fb5ca32d37e447afc0ef845a2103
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  directus:
    image: directus/directus@sha256:27fd291463f4e746a7911139377a1dbc7a5c09ae82ee15b028b97bcc4950c69d
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Directus Admin Studio strictly loopback-bound for SSH/VPN only (SEC-002, OPS-010)
      - "127.0.0.1:${DIRECTUS_HOST_PORT:-8055}:8055"
    environment:
      NODE_ENV: production
      KEY: ${DIRECTUS_KEY:?DIRECTUS_KEY is required}
      SECRET: ${DIRECTUS_SECRET:?DIRECTUS_SECRET is required}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:?DIRECTUS_PUBLIC_URL is required}
      PASSWORD_RESET_URL_ALLOW_LIST: ${DIRECTUS_PASSWORD_RESET_URL_ALLOW_LIST:?DIRECTUS_PASSWORD_RESET_URL_ALLOW_LIST is required}
      USER_REGISTER_URL_ALLOW_LIST: ${DIRECTUS_USER_REGISTER_URL_ALLOW_LIST:?DIRECTUS_USER_REGISTER_URL_ALLOW_LIST is required}
      EMAIL_VERIFICATION_TOKEN_TTL: ${DIRECTUS_EMAIL_VERIFICATION_TOKEN_TTL:?DIRECTUS_EMAIL_VERIFICATION_TOKEN_TTL is required}
      LOG_HTTP_IGNORE_PATHS: /users/register/verify-email
      ACCESS_TOKEN_TTL: ${DIRECTUS_ACCESS_TOKEN_TTL:?DIRECTUS_ACCESS_TOKEN_TTL is required}
      REFRESH_TOKEN_TTL: ${DIRECTUS_REFRESH_TOKEN_TTL:?DIRECTUS_REFRESH_TOKEN_TTL is required}
      LICENSE_KEY: ${DIRECTUS_LICENSE_KEY:-}
      LICENSE_TOKEN: ${DIRECTUS_LICENSE_TOKEN:-}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CACHE_ENABLED: "true"
      CACHE_STORE: redis
      CACHE_AUTO_PURGE: "true"
      REDIS: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      EMAIL_TRANSPORT: ${DIRECTUS_EMAIL_TRANSPORT:-smtp}
      EMAIL_FROM: ${DIRECTUS_EMAIL_FROM:?DIRECTUS_EMAIL_FROM is required}
      EMAIL_SMTP_HOST: ${DIRECTUS_EMAIL_SMTP_HOST:-smtp.sendgrid.net}
      EMAIL_SMTP_PORT: ${DIRECTUS_EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${DIRECTUS_EMAIL_SMTP_USER:-apikey}
      EMAIL_SMTP_PASSWORD: ${DIRECTUS_EMAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_SECURE: "false"
      TELEMETRY: "false"
    volumes:
      - directus_uploads:/directus/uploads
      - ./apps/directus/extensions:/directus/extensions:ro
    networks:
      - application
      - data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8055/server/info').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      directus:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_ENV: production
      WORKER_SERVICE_NAME: ${WORKER_SERVICE_NAME:-integration-worker}
      WORKER_PORT: ${WORKER_PORT:-8081}
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      WEATHER_WORKER_DB_USER: ${WEATHER_WORKER_DB_USER:?WEATHER_WORKER_DB_USER is required}
      WEATHER_WORKER_DB_PASSWORD: ${WEATHER_WORKER_DB_PASSWORD:?WEATHER_WORKER_DB_PASSWORD is required}
      WEATHER_WORKER_ID: ${WEATHER_WORKER_ID:?WEATHER_WORKER_ID is required}
      WEATHER_WORKER_POLL_INTERVAL_MS: ${WEATHER_WORKER_POLL_INTERVAL_MS:-60000}
      WEATHER_WORKER_LEASE_DURATION_MS: ${WEATHER_WORKER_LEASE_DURATION_MS:-120000}
      WEATHER_WORKER_HEARTBEAT_INTERVAL_MS: ${WEATHER_WORKER_HEARTBEAT_INTERVAL_MS:-30000}
      WEATHER_WORKER_RETRY_BASE_DELAY_MS: ${WEATHER_WORKER_RETRY_BASE_DELAY_MS:-5000}
      WEATHER_WORKER_RETRY_MAX_DELAY_MS: ${WEATHER_WORKER_RETRY_MAX_DELAY_MS:-60000}
      WEATHER_WORKER_RETRY_JITTER_RATIO: ${WEATHER_WORKER_RETRY_JITTER_RATIO:-0.2}
      WEATHER_PROVIDER_KEY: ${WEATHER_PROVIDER_KEY:-weatherapi}
      WEATHERAPI_API_KEY: ${WEATHERAPI_API_KEY:?WEATHERAPI_API_KEY is required}
      WEATHER_PROVIDER_TIMEOUT_MS: ${WEATHER_PROVIDER_TIMEOUT_MS:-8000}
      WEATHER_PARSER_VERSION: ${WEATHER_PARSER_VERSION:-weatherapi-forecast-v1}
      WEATHER_PROVIDER_CIRCUIT_FAILURE_THRESHOLD: ${WEATHER_PROVIDER_CIRCUIT_FAILURE_THRESHOLD:-3}
      WEATHER_PROVIDER_CIRCUIT_RESET_MS: ${WEATHER_PROVIDER_CIRCUIT_RESET_MS:-60000}
      WEATHERAPI_FORECAST_DAYS: ${WEATHERAPI_FORECAST_DAYS:-3}
    networks:
      - application
      - data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:${WORKER_PORT:-8081}/health/ready').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      directus:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_ENV: production
      API_SERVICE_NAME: ${API_SERVICE_NAME:-application-api}
      API_PORT: ${API_PORT:-8080}
      API_DIRECTUS_URL: http://directus:8055
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:?API_ALLOWED_ORIGINS is required}
      API_PASSWORD_RESET_CONSUME_URL: ${API_PASSWORD_RESET_CONSUME_URL:?API_PASSWORD_RESET_CONSUME_URL is required}
      API_PASSWORD_RESET_REDIRECT_URL: ${API_PASSWORD_RESET_REDIRECT_URL:?API_PASSWORD_RESET_REDIRECT_URL is required}
      API_PASSWORD_RESET_TTL_SECONDS: ${API_PASSWORD_RESET_TTL_SECONDS:-900}
      API_PASSWORD_RESET_MIN_LENGTH: ${API_PASSWORD_RESET_MIN_LENGTH:-12}
      API_EMAIL_VERIFICATION_CONSUME_URL: ${API_EMAIL_VERIFICATION_CONSUME_URL:?API_EMAIL_VERIFICATION_CONSUME_URL is required}
      API_EMAIL_VERIFICATION_REDIRECT_URL: ${API_EMAIL_VERIFICATION_REDIRECT_URL:?API_EMAIL_VERIFICATION_REDIRECT_URL is required}
      API_EMAIL_VERIFICATION_TTL_SECONDS: ${API_EMAIL_VERIFICATION_TTL_SECONDS:-900}
      API_REGISTRATION_MIN_LENGTH: ${API_REGISTRATION_MIN_LENGTH:-12}
      API_TRAVELER_ROLE_ID: ${API_TRAVELER_ROLE_ID:?API_TRAVELER_ROLE_ID is required}
      API_SESSION_COOKIE_NAME: ${API_SESSION_COOKIE_NAME:-__Host-vnwa_session}
      API_CSRF_COOKIE_NAME: ${API_CSRF_COOKIE_NAME:-__Host-vnwa_csrf}
      API_SESSION_SAME_SITE: ${API_SESSION_SAME_SITE:-strict}
      API_SESSION_TTL_SECONDS: ${API_SESSION_TTL_SECONDS:-1209600}
      API_USER_SESSION_LIMIT: ${API_USER_SESSION_LIMIT:-5}
      API_STAFF_SESSION_LIMIT: ${API_STAFF_SESSION_LIMIT:-2}
      API_MAX_BODY_BYTES: ${API_MAX_BODY_BYTES:-16384}
      API_RATE_LIMIT_DEFAULT_MAX: ${API_RATE_LIMIT_DEFAULT_MAX:-120}
      API_RATE_LIMIT_LOGIN_MAX: ${API_RATE_LIMIT_LOGIN_MAX:-5}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-60000}
      API_RATE_LIMIT_WEATHER_MAX: ${API_RATE_LIMIT_WEATHER_MAX:-60}
      API_WEATHER_CACHE_TTL_SECONDS: ${API_WEATHER_CACHE_TTL_SECONDS:-1800}
      API_WEATHER_PENDING_RETRY_SECONDS: ${API_WEATHER_PENDING_RETRY_SECONDS:-30}
      API_REDIS_TIMEOUT_MS: ${API_REDIS_TIMEOUT_MS:-2000}
      API_ACCESS_REFRESH_SKEW_MS: ${API_ACCESS_REFRESH_SKEW_MS:-60000}
      API_TRUST_PROXY: ${API_TRUST_PROXY:-true}
      API_SESSION_ENCRYPTION_KEY: ${API_SESSION_ENCRYPTION_KEY:?API_SESSION_ENCRYPTION_KEY is required}
      API_CSRF_SIGNING_KEY: ${API_CSRF_SIGNING_KEY:?API_CSRF_SIGNING_KEY is required}
      WEATHERAPI_API_KEY: ${WEATHERAPI_API_KEY:?WEATHERAPI_API_KEY is required}
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      API_DB_USER: ${API_DB_USER:?API_DB_USER is required}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?API_DB_PASSWORD is required}
      API_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1
    networks:
      - application
      - data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:${API_PORT:-8080}/health/ready').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-80}:8080"
    networks:
      - application
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

networks:
  application:
  data:
    internal: true

volumes:
  database_data:
  redis_data:
  directus_uploads:
