name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Validate Compose contract
        shell: bash
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 32)"
          redis_password="$(openssl rand -hex 32)"
          directus_key="$(openssl rand -hex 32)"
          directus_secret="$(openssl rand -hex 64)"
          printf '::add-mask::%s\n' "$db_password" "$redis_password" "$directus_key" "$directus_secret"
          export COMPOSE_PROJECT_NAME=vietnam_weather_ci
          export APP_ENV=development
          export DIRECTUS_HOST_PORT=8055
          export WORKER_HOST_PORT=8081
          export MAILPIT_SMTP_HOST_PORT=1025
          export MAILPIT_UI_HOST_PORT=8025
          export DB_DATABASE=directus
          export DB_USER=directus
          export DB_PASSWORD="$db_password"
          export REDIS_PASSWORD="$redis_password"
          export DIRECTUS_KEY="$directus_key"
          export DIRECTUS_SECRET="$directus_secret"
          export DIRECTUS_PUBLIC_URL=http://localhost:8055
          export DIRECTUS_EMAIL_FROM=noreply@example.com
          export WORKER_SERVICE_NAME=integration-worker
          export WORKER_PORT=8081
          docker compose config --quiet

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/sbom/source.cdx.json

      - name: Upload source SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-sbom-${{ github.sha }}
          path: artifacts/sbom/source.cdx.json
          if-no-files-found: error
          retention-days: 14

  worker-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable worker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/vietnam-weather-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
