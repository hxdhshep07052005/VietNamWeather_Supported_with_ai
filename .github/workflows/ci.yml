name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Validate Compose contract
        shell: bash
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 32)"
          redis_password="$(openssl rand -hex 32)"
          directus_key="$(openssl rand -hex 32)"
          directus_secret="$(openssl rand -hex 64)"
          printf '::add-mask::%s\n' "$db_password" "$redis_password" "$directus_key" "$directus_secret"
          export COMPOSE_PROJECT_NAME=vietnam_weather_ci
          export APP_ENV=development
          export DIRECTUS_HOST_PORT=8055
          export WORKER_HOST_PORT=8081
          export MAILPIT_SMTP_HOST_PORT=1025
          export MAILPIT_UI_HOST_PORT=8025
          export DB_DATABASE=directus
          export DB_USER=directus
          export DB_PASSWORD="$db_password"
          export REDIS_PASSWORD="$redis_password"
          export DIRECTUS_KEY="$directus_key"
          export DIRECTUS_SECRET="$directus_secret"
          export DIRECTUS_PUBLIC_URL=http://localhost:8055
          export DIRECTUS_EMAIL_FROM=noreply@example.com
          export WORKER_SERVICE_NAME=integration-worker
          export WORKER_PORT=8081
          docker compose config --quiet

      - name: Scan repository for secrets
        shell: bash
        run: |
          set -euo pipefail
          image='zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f'
          docker run --rm --volume "$PWD:/repo:ro" "$image" dir /repo --config /repo/.gitleaks.toml --redact=100 --no-banner --no-color
          docker run --rm --volume "$PWD:/repo:ro" "$image" git /repo --config /repo/.gitleaks.toml --redact=100 --no-banner --no-color

      - name: Generate source SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/sbom
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            --volume "$PWD/artifacts/sbom:/output" \
            anchore/syft@sha256:1288ea4c8b38767b4e620c1e312c8cb26b6e887a99b4f07ab6cd19fc6f225026 \
            dir:/repo \
            --source-name vietnam-weather-ai \
            --source-version "$GITHUB_SHA" \
            --output cyclonedx-json=/output/source.cdx.json
          test -s artifacts/sbom/source.cdx.json

      - name: Upload source SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-sbom-${{ github.sha }}
          path: artifacts/sbom/source.cdx.json
          if-no-files-found: error
          retention-days: 14

  worker-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/worker/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/vietnam-weather-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
