title = "Vietnam Weather repository secret scan"

[extend]
useDefault = true

[[allowlists]]
description = "Git-ignored local secret files are outside repository evidence"
paths = [
  '''(^|/)\.env(\..*)?\.local$''',
  '''(^|/)secrets/decrypted/''',
  '''(^|/)node_modules/''',
  '''(^|/)artifacts/phase2/local/'''
]

[[allowlists]]
description = "Test files with intentional fake secrets for security testing"
paths = [
  '''apps/worker/test/weatherapi-adapter\.test\.mjs'''
]
