<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066CC"/>
      <stop offset="100%" style="stop-color:#FFCD00"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFCD00"/>
      <stop offset="100%" style="stop-color:#E6B800"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)"/>

  <!-- Sun rays -->
  <g stroke="#0066CC" stroke-width="2.5" stroke-linecap="round">
    <line x1="32" y1="6" x2="32" y2="12"/>
    <line x1="32" y1="52" x2="32" y2="58"/>
    <line x1="6" y1="32" x2="12" y2="32"/>
    <line x1="52" y1="32" x2="58" y2="32"/>
    <line x1="13.5" y1="13.5" x2="17.7" y2="17.7"/>
    <line x1="46.3" y1="46.3" x2="50.5" y2="50.5"/>
    <line x1="13.5" y1="50.5" x2="17.7" y2="46.3"/>
    <line x1="46.3" y1="17.7" x2="50.5" y2="13.5"/>
  </g>

  <!-- Sun center -->
  <circle cx="32" cy="32" r="10" fill="url(#sunGrad)"/>

  <!-- Cloud -->
  <g fill="#FFFFFF" opacity="0.95">
    <ellipse cx="28" cy="36" rx="6" ry="4"/>
    <ellipse cx="36" cy="35" rx="5" ry="4"/>
    <ellipse cx="32" cy="33" rx="4" ry="3"/>
  </g>
</svg>
