_i) and Max-Severity S_route</text><line x1="1590.64" y1="1743.701" x2="1721.89" y2="1743.701" style="stroke:#181818;stroke-width:3.125;"/><line x1="1721.89" y1="1743.701" x2="1721.89" y2="1784.326" style="stroke:#181818;stroke-width:3.125;"/><line x1="1593.765" y1="1784.326" x2="1721.89" y2="1784.326" style="stroke:#181818;stroke-width:3.125;"/><polygon points="1625.015,1771.826,1593.765,1784.326,1625.015,1796.826,1612.515,1784.326" fill="#181818" style="stroke:#181818;stroke-width:3.125;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1612.515" y="1680.58" fill="#000" font-size="40.625" font-weight="700" font-family="'Segoe UI, Arial, sans-serif'">9</text><text x="1653.282" y="1633.29" fill="#000" font-size="40.625" textLength="1193.816" font-family="'Segoe UI, Arial, sans-serif'">Calculate Distance-Weighted Cumulative Risk S_avg_route</text><text x="1653.282" y="1680.58" fill="#000" font-size="40.625" textLength="638.812" font-family="'Segoe UI, Arial, sans-serif'">Compute multi-objective score:</text><text x="1653.282" y="1727.87" fill="#000" font-size="40.625" textLength="1296.747" font-family="'Segoe UI, Arial, sans-serif'">Score = w_risk * S_route + w_time * T_norm + w_dist * D_norm</text><line x1="1590.64" y1="1919.116" x2="1721.89" y2="1919.116" style="stroke:#181818;stroke-width:3.125;"/><line x1="1721.89" y1="1919.116" x2="1721.89" y2="1959.741" style="stroke:#181818;stroke-width:3.125;"/><line x1="1593.765" y1="1959.741" x2="1721.89" y2="1959.741" style="stroke:#181818;stroke-width:3.125;"/><polygon points="1625.015,1947.241,1593.765,1959.741,1625.015,1972.241,1612.515,1959.741" fill="#181818" style="stroke:#181818;stroke-width:3.125;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1612.515" y="1903.285" fill="#000" font-size="40.625" textLength="56.534" font-weight="700" font-family="'Segoe UI, Arial, sans-serif'">10</text><text x="1681.549" y="1903.285" fill="#000" font-size="40.625" textLength="1209.01" font-family="'Segoe UI, Arial, sans-